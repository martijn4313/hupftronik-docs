name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagram-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Harness Bench tests
        run: node --test tests/diagram-editor/*.test.mjs
