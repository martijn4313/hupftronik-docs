        - 3. Flashing the Board: products/motorsteuergerat-24p-v1/setup/flashing.md
        - 4. Wiring and Hardware Guide: products/motorsteuergerat-24p-v1/wiring.md
        - 5. Firmware Setup:
          - rusEFI Setup Guide: products/motorsteuergerat-24p-v1/setup/rusefi.md
          - Speeduino Setup Guide: products/motorsteuergerat-24p-v1/setup/speeduino.md
        - 6. Calibration and Dynamic Testing: products/motorsteuergerat-24p-v1/setup/calibration.md
      - Reference:
